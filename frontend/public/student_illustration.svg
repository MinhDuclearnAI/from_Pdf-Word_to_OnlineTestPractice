<svg viewBox="0 0 700 730" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2151d1"/>
      <stop offset="100%" stop-color="#3c72f5"/>
    </linearGradient>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3c72f5"/>
      <stop offset="100%" stop-color="#2151d1"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1c3d8f" flood-opacity="0.14"/>
    </filter>
    <filter id="handleShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#12369c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- page background -->
  <rect x="0" y="0" width="700" height="730" fill="#f3f7fd"/>

  <!-- ===================== CARD ===================== -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="30" width="620" height="660" rx="26" fill="#ffffff"/>
  </g>

  <!-- top chrome bar -->
  <circle cx="70" cy="58" r="6" fill="#dbe3ee"/>
  <circle cx="92" cy="58" r="6" fill="#dbe3ee"/>
  <circle cx="114" cy="58" r="6" fill="#dbe3ee"/>

  <!-- ===================== LEFT PANEL (BEFORE - paper exam) ===================== -->
  <path d="M 66,100 H 350 V 600 H 66 Q 56,600 56,590 V 110 Q 56,100 66,100 Z" fill="#eef2f8"/>

  <text x="86" y="130" font-size="10.5" font-weight="700" letter-spacing="1" fill="#94a3b8">TRƯỜNG THPT SỐ 1</text>
  <text x="86" y="160" font-size="22" font-weight="800" fill="#1e293b">ĐỀ KIỂM TRA</text>
  <text x="86" y="186" font-size="22" font-weight="800" fill="#1e293b">HỌC KỲ</text>
  <text x="86" y="208" font-size="11.5" fill="#64748b">Môn: Toán học &#8226; 45 phút</text>
  <line x1="86" y1="222" x2="330" y2="222" stroke="#dbe3ee" stroke-width="1.4"/>

  <text x="86" y="246" font-size="12.5" font-weight="700" fill="#1e293b">Câu 1: Giải phương trình</text>
  <text x="98" y="264" font-size="12.5" font-weight="700" fill="#1e293b">x&#178; - 5x + 6 = 0</text>

  <g font-size="11.5" fill="#64748b">
    <text x="86" y="288">A. x = 1; x = 6</text>
    <text x="216" y="288">B. x = 2; x = 3</text>
    <text x="86" y="306">C. x = -2; x = -3</text>
    <text x="216" y="306">D. x = 0; x = 5</text>
  </g>

  <line x1="86" y1="326" x2="330" y2="326" stroke="#e2e8f2" stroke-width="1.2"/>
  <text x="86" y="348" font-size="12" font-weight="700" fill="#1e293b">Câu 2:</text>
  <rect x="86" y="358" width="244" height="8" rx="3" fill="#dbe3ee"/>
  <rect x="86" y="374" width="196" height="8" rx="3" fill="#dbe3ee"/>

  <line x1="86" y1="396" x2="330" y2="396" stroke="#e2e8f2" stroke-width="1.2"/>
  <text x="86" y="418" font-size="12" font-weight="700" fill="#1e293b">Câu 3:</text>
  <rect x="86" y="428" width="244" height="8" rx="3" fill="#dbe3ee"/>
  <rect x="86" y="444" width="210" height="8" rx="3" fill="#dbe3ee"/>
  <rect x="86" y="460" width="160" height="8" rx="3" fill="#dbe3ee"/>

  <text x="86" y="498" font-style="italic" font-size="13" font-weight="700" fill="#3c72f5">*** ĐỀ GỐC (PDF/WORD) ***</text>

  <g transform="translate(255,548) rotate(-12)">
    <rect x="0" y="0" width="74" height="26" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
    <text x="37" y="18" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1">BẢN GIẤY</text>
  </g>

  <!-- ===================== RIGHT PANEL (AFTER - online interface) ===================== -->
  <path d="M 634,100 H 350 V 600 H 634 Q 644,600 644,590 V 110 Q 644,100 634,100 Z" fill="#ffffff"/>

  <!-- app header -->
  <rect x="362" y="112" width="272" height="56" rx="10" fill="url(#blueGrad)"/>
  <text x="378" y="136" font-size="13" font-weight="800" fill="#ffffff">Bài Kiểm Tra Trực Tuyến</text>
  <text x="378" y="154" font-size="10.5" fill="#dbe6fd">Môn: Toán học &#8226; Câu 1/20</text>
  <g transform="translate(578,120)">
    <rect x="0" y="0" width="44" height="22" rx="11" fill="#ffffff" opacity="0.2"/>
    <circle cx="12" cy="11" r="6" fill="none" stroke="#ffffff" stroke-width="1.3"/>
    <line x1="12" y1="11" x2="12" y2="7.5" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="12" y1="11" x2="14.2" y2="12.6" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
    <text x="22" y="15" font-size="9" font-weight="700" fill="#ffffff">23:45</text>
  </g>

  <!-- progress bar -->
  <rect x="362" y="178" width="272" height="5" rx="2.5" fill="#e9edf7"/>
  <rect x="362" y="178" width="20" height="5" rx="2.5" fill="#2151d1"/>

  <!-- question card -->
  <rect x="362" y="196" width="272" height="102" rx="9" fill="#f5f8fe" stroke="#e7ecf7" stroke-width="1"/>
  <text x="378" y="216" font-size="11" font-weight="700" fill="#2151d1">Câu 1</text>
  <text x="378" y="234" font-size="11.5" fill="#1e293b">Giải phương trình x&#178; - 5x + 6 = 0</text>

  <g font-size="10.5">
    <rect x="378" y="246" width="118" height="22" rx="11" fill="#ffffff" stroke="#dbe3f5" stroke-width="1.3"/>
    <circle cx="390" cy="257" r="5" fill="none" stroke="#9fb3e6" stroke-width="1.4"/>
    <text x="401" y="261" fill="#3c4457">x = 1; x = 6</text>

    <rect x="504" y="246" width="118" height="22" rx="11" fill="#e9f0ff" stroke="#2151d1" stroke-width="1.4"/>
    <circle cx="516" cy="257" r="5" fill="#2151d1"/>
    <circle cx="516" cy="257" r="2" fill="#ffffff"/>
    <text x="527" y="261" font-weight="700" fill="#2151d1">x = 2; x = 3</text>

    <rect x="378" y="274" width="118" height="22" rx="11" fill="#ffffff" stroke="#dbe3f5" stroke-width="1.3"/>
    <circle cx="390" cy="285" r="5" fill="none" stroke="#9fb3e6" stroke-width="1.4"/>
    <text x="401" y="289" fill="#3c4457">x = -2; x = -3</text>

    <rect x="504" y="274" width="118" height="22" rx="11" fill="#ffffff" stroke="#dbe3f5" stroke-width="1.3"/>
    <circle cx="516" cy="285" r="5" fill="none" stroke="#9fb3e6" stroke-width="1.4"/>
    <text x="527" y="289" fill="#3c4457">x = 0; x = 5</text>
  </g>

  <text x="362" y="322" font-size="9.5" font-weight="700" letter-spacing="1" fill="#94a3b8">DANH SÁCH CÂU HỎI</text>
  <g font-size="9.5" font-weight="700">
    <circle cx="372" cy="340" r="10" fill="#e9f0ff" stroke="#2151d1" stroke-width="1.4"/><text x="372" y="343.5" fill="#2151d1" text-anchor="middle">1</text>
    <circle cx="398" cy="340" r="10" fill="#f1f4fa"/><text x="398" y="343.5" fill="#94a3b8" text-anchor="middle">2</text>
    <circle cx="424" cy="340" r="10" fill="#f1f4fa"/><text x="424" y="343.5" fill="#94a3b8" text-anchor="middle">3</text>
    <circle cx="450" cy="340" r="10" fill="#f1f4fa"/><text x="450" y="343.5" fill="#94a3b8" text-anchor="middle">4</text>
    <circle cx="476" cy="340" r="10" fill="#f1f4fa"/><text x="476" y="343.5" fill="#94a3b8" text-anchor="middle">5</text>
    <circle cx="502" cy="340" r="10" fill="#f1f4fa"/><text x="502" y="343.5" fill="#94a3b8" text-anchor="middle">6</text>
    <circle cx="528" cy="340" r="10" fill="#f1f4fa"/><text x="528" y="343.5" fill="#94a3b8" text-anchor="middle">7</text>
    <circle cx="554" cy="340" r="10" fill="#f1f4fa"/><text x="554" y="343.5" fill="#94a3b8" text-anchor="middle">8</text>
  </g>

  <rect x="362" y="366" width="128" height="32" rx="16" fill="#ffffff" stroke="#dbe3f5" stroke-width="1.4"/>
  <text x="426" y="386" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">&#8592; Câu trước</text>

  <rect x="506" y="366" width="128" height="32" rx="16" fill="#2151d1"/>
  <text x="570" y="386" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Câu tiếp &#8594;</text>

  <rect x="362" y="410" width="272" height="38" rx="19" fill="url(#blueGrad)"/>
  <text x="498" y="434" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">NỘP BÀI</text>

  <g transform="translate(362,466)">
    <circle cx="5" cy="-3" r="4.5" fill="#7fce8f"/>
    <text x="16" y="0" font-size="10" fill="#94a3b8">Đã lưu tự động &#8226; 23:44</text>
  </g>

  <!-- ===================== DIVIDER + DRAG HANDLE ===================== -->
  <line x1="350" y1="100" x2="350" y2="600" stroke="url(#dividerGrad)" stroke-width="5"/>
  <g filter="url(#handleShadow)">
    <circle cx="350" cy="522" r="34" fill="url(#dividerGrad)"/>
  </g>
  <path d="M 330,522 L 340,514 L 340,530 Z" fill="#ffffff"/>
  <path d="M 370,522 L 360,514 L 360,530 Z" fill="#ffffff"/>
  <line x1="341" y1="522" x2="359" y2="522" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>

  <!-- bottom labels -->
  <text x="76" y="644" font-size="14" font-weight="800" letter-spacing="2" fill="#94a3b8">TRƯỚC</text>
  <text x="624" y="644" font-size="14" font-weight="800" letter-spacing="2" fill="#2151d1" text-anchor="end">SAU</text>
</svg>
